# Dependabot opens a PR when a dependency has a new version or a security fix.
# Each PR runs the full pipeline, so an upgrade only merges if everything still passes.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      # One PR for all the dev tooling instead of ten.
      dev-tools:
        dependency-type: development
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
